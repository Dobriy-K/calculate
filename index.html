<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <!-- <link rel="stylesheet" href="aiStyle.css" /> -->
    <!-- <script src="main.js" defer></script> -->
    <script src="aiMain.js" defer></script>
  </head>
  <body>
    <select name="view" id="select">
      <option value="0" selected>--Вид начисления--</option>
      <option value="1">НДостиж (СЗВЗ)</option>
      <option value="1">ПНС (ежемесячная)</option>
      <option value="1">НОУС</option>
      <option value="2">Зграничный коэффициент</option>
      <option value="2">ПНВЛ (за выслугу)</option>
      <option value="1">ЕН за КК</option>
      <option value="1">НОУС за Абхазию</option>
      <option value="2">Месячная премия</option>
    </select>
    <span class="red_line"></span>
    <div class="checkCont">
      <p>Выберите должность:</p>
      <label>
        <input
          type="radio"
          name="secRadio"
          value="tehnik"
          class="dolzhnost"
        />Техник ***</label
      >
      <label>
        <input type="radio" name="secRadio" value="radist" class="dolzhnost" />
        Радист **</label
      >
      <label>
        <input type="radio" name="secRadio" value="radist+" class="dolzhnost" />
        Радист ***</label
      >
      <label>
        <input type="radio" name="secRadio" value="voditel" class="dolzhnost" />
        Водитель **</label
      >
      <label>
        <input
          type="radio"
          name="secRadio"
          value="voditel+"
          class="dolzhnost"
        />
        Водитель ***</label
      >
    </div>
    <span class="red_line"></span>
    <div class="cont">
      <input
        type="text"
        placeholder="Оклад по званию"
        class="inp"
        id="zvan"
        value=""
      />
      <input
        type="text"
        placeholder="Оклад по должности"
        class="inp"
        id="dol"
        value=""
      />
      <input
        type="text"
        placeholder="Сумма начисления"
        class="inp"
        id="article"
      />
    </div>
    <div class="resAndRebut">
      <input type="text" placeholder="%" class="inp" id="proc" />
      <div id="resetBtn" class=""></div>
    </div>
    <span class="red_line"></span>
  </body>
</html>
